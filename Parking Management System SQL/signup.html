<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" type="text/css" href="styles1.css" media="screen" />
  <title>Parking Management System - Sign up</title>
  <style>
    
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #ffffff; /* Set page background color to white */
    }

    .signup-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #add8e6; /* Set form background color */
      padding: 20px;
      border: 1px solid #cccccc; /* Add a small border around the form */
      border-radius: 10px; /* Add a slight rounded corner effect */
    }

    .signup-title {
      margin-bottom: 20px;
      font-weight: bold; 
    }
  </style>
</head>

<body>
  <div class="signup-container">
    <h1 class="signup-title">Sign up for Parking Lot Management System</h1>
    <form class="signup-form" action="/signup" method="POST">
      <input type="text" id="fullname" name="fullname" placeholder="Full Name" required>
      <input type="email" id="email" name="email" placeholder="Email" required>
      <input type="password" id="password" name="password" placeholder="Password" required>
      <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm Password" required>
      <button type="submit" id="signup-btn">Sign up</button>
    </form>
    <p class="signup-text">Already have an account? <a href="login.html">Login</a></p>
  </div>

  <script type="text/javascript" src="script1.js"></script>
</body>
</html>
